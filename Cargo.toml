[package]
name = "portwatch"
version = "0.1.0"
edition = "2021"
authors = ["Juan Castiñeira <juancastingo@gmail.com>"]
description = "Local port & exposure security hygiene scanner detecting exposed services, unauthenticated databases, and dev servers with transparent rule explanations."
repository = "https://github.com/juancastingo/portwatch"
homepage = "https://github.com/juancastingo/portwatch"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["security", "ports", "hygiene", "scanner", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
